name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [codex/unified-v2-alpha]
    paths: ['distribution/**', 'tools/package/**', 'requirements-windows.lock', 'requirements-build.txt', '.github/workflows/windows-package.yml', 'app.py', 'ui/**', 'config.py', 'speech/**', 'ai/**', 'storage/**', 'literature/**', 'settings.py', 'requirements.txt', 'tests/**']
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-windows.lock --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu --only-binary=llama-cpp-python
      - run: python -m unittest discover -s tests -v
      - name: Build app and per-user installer
        shell: pwsh
        run: ./tools/package/build.ps1 -Python python -Compiler 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
      - name: Verify packaged native runtime and UI
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'anamnez-smoke.json'
          $process = Start-Process dist/AnamnezAsistani/AnamnezAsistani.exe -ArgumentList @('--package-smoke', $output) -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0 -or !(Test-Path $output)) { throw 'Packaged runtime smoke failed' }
          Get-Content $output
      - name: Synthetic install, upgrade, rollback and data preservation
        shell: pwsh
        run: ./tools/package/test-install.ps1
      - name: Actual first small-model download, load and silent transcription from EXE
        timeout-minutes: 15
        shell: pwsh
        run: |
          $env:HF_HUB_CACHE = Join-Path $env:RUNNER_TEMP 'fresh-whisper-cache'
          $report = Join-Path $env:RUNNER_TEMP 'full-model-smoke.json'
          $process = Start-Process dist/AnamnezAsistani/AnamnezAsistani.exe -ArgumentList @('--model-smoke', $report) -WindowStyle Hidden -PassThru -Wait
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0 -or !(Test-Path $report)) { throw 'Full model smoke failed' }
          $data = Get-Content $report -Raw | ConvertFrom-Json
          if (!$data.model_load -or !$data.silence_transcription) { throw 'Actual model inference failed' }
      - name: Actual local clinical model extraction from EXE
        timeout-minutes: 20
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'clinical-smoke.json'
          $process = Start-Process dist/AnamnezAsistani/AnamnezAsistani.exe -ArgumentList @('--clinical-smoke', $report) -WindowStyle Hidden -PassThru -Wait
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0 -or !(Test-Path $report)) { throw 'Local clinical model smoke failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Anamnez-alpha1.5-Windows
          path: dist/Anamnez-Asistani-Kurulum.exe
