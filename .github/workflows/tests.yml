name: CPU compatibility tests
on: [push, pull_request]
jobs:
  tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Core and hidden Tk tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Core and hidden Tk tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - run: python -m compileall -q ai literature safety speech storage ui app.py settings.py
